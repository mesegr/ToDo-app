name: Flutter CI

on:
  push:
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-dependency-path: todo_app/pubspec.lock

      - name: Install dependencies
        working-directory: todo_app
        run: flutter pub get

      - name: Analyze
        working-directory: todo_app
        run: flutter analyze

      - name: Run tests
        working-directory: todo_app
        run: flutter test
